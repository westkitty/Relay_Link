[project]
name = "relay-link"
version = "0.1.0"
description = "macOS WebSocket relay daemon for Android clipboard and pointer handoff."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12.0",
]

[project.optional-dependencies]
macos = [
  "pyobjc-framework-Cocoa>=10.0",
  "pyobjc-framework-Quartz>=10.0",
  "rumps>=0.4.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
relay-link-daemon = "relay_link.daemon:main"
relay-link-menubar = "relay_link.menubar:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

